<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Car | Carswich Dealer</title>

    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../Shared/app.css">
    <link rel="stylesheet" href="addcar.css">
</head>
<body>

<header class="navbar">
    <a href="dashboard.html" class="logo">Carswich</a>
    <nav class="nav-links">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="dealeraccount.html" class="nav-link">Account</a>
    </nav>
</header>

<main class="content">
    <h1>Add a New Car</h1>
    <p class="tagline">Fill in the details below to list a new car.</p>

    <form id="addCarForm">

        <label>Make</label>
        <input type="text" id="make" required>

        <label>Model</label>
        <input type="text" id="model" required>

        <label>Year</label>
        <input type="number" id="year" required>

        <label>Mileage</label>
        <input type="number" id="mileage" required>

        <label>Colour</label>
        <input type="text" id="colour" required>

        <label>Price ($)</label>
        <input type="number" id="price" required>

        <label>Description</label>
        <textarea id="description" required></textarea>

        <button type="submit" class="btn btn-primary">Add Car</button>
    </form>

    <p id="addCarMessage"></p>
</main>
<button class="btn btn-secondary" onclick="goBackToDashboard()">Back to Dashboard</button>

<script src="addcar.js"></script>
</body>
</html>
