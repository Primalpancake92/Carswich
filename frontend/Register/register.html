<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Carswich</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <header class="navbar">
        <a href="../index.html" class="logo">
            <svg class="logo-icon" viewBox="0 0 64 40" aria-hidden="true">
                <path d="M6 28 L10 17 Q12 12 18 12 L40 12 Q45 12 49 17 L54 22 Q60 23 60 28 L60 30 L6 30 Z" fill="#2b7bd6"/>
                <path d="M16 17 Q17 15 20 15 L29 15 L29 22 L13 22 Z M32 15 L39 15 Q43 15 46 19 L48 22 L32 22 Z" fill="#dbeeff"/>
                <circle cx="18" cy="30" r="6" fill="#0d3b66"/>
                <circle cx="18" cy="30" r="2.5" fill="#ffffff"/>
                <circle cx="48" cy="30" r="6" fill="#0d3b66"/>
                <circle cx="48" cy="30" r="2.5" fill="#ffffff"/>
                <path d="M2 36 Q32 42 62 36" stroke="#7cc4fa" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            </svg>
            <span class="logo-text">Car<span class="logo-accent">swich</span></span>
        </a>
    </header>

    <main class="split">
        <section class="panel panel-about">
            <h1>Join <span class="logo-accent">Carswich</span></h1>
            <p class="tagline">Create a free account to start buying, or list your cars as a dealer.</p>

            <!-- Background art: sky fills the panel, ground runs along the bottom -->
            <svg class="scene-sky" viewBox="0 0 720 800" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
                <circle cx="600" cy="110" r="46" fill="#b9dfff"/>
                <g fill="#ffffff" opacity="0.85">
                    <ellipse cx="110" cy="70" rx="44" ry="15"/>
                    <ellipse cx="138" cy="58" rx="28" ry="17"/>
                    <ellipse cx="420" cy="48" rx="34" ry="12"/>
                    <ellipse cx="442" cy="38" rx="22" ry="14"/>
                    <ellipse cx="560" cy="260" rx="38" ry="13"/>
                    <ellipse cx="584" cy="250" rx="24" ry="15"/>
                </g>
            </svg>

            <svg class="scene-ground" viewBox="0 0 720 280" aria-hidden="true">
                <!-- Trees (drawn first so the hills hide the bottom of the trunks) -->
                <g fill="#1f63b5">
                    <rect x="77" y="70" width="6" height="70"/>
                    <rect x="517" y="55" width="6" height="85"/>
                    <rect x="558" y="50" width="4" height="90"/>
                    <rect x="657" y="45" width="6" height="95"/>
                </g>
                <circle cx="80" cy="60" r="14" fill="#7cc4fa"/>
                <circle cx="520" cy="44" r="16" fill="#7cc4fa"/>
                <circle cx="560" cy="42" r="11" fill="#2b7bd6"/>
                <circle cx="660" cy="36" r="14" fill="#7cc4fa"/>

                <!-- Back hills -->
                <path d="M0 110 Q120 60 240 95 T480 85 T720 70 V280 H0 Z" fill="#dbeeff"/>

                <!-- Front hills -->
                <path d="M0 150 Q150 115 300 140 T600 130 T720 135 V280 H0 Z" fill="#b9dfff"/>

                <!-- Road -->
                <rect x="0" y="190" width="720" height="60" fill="#0d3b66"/>
                <line x1="0" y1="220" x2="720" y2="220" stroke="#ffffff" stroke-width="4" stroke-dasharray="28 20"/>

                <!-- Speed lines -->
                <g stroke="#7cc4fa" stroke-width="4" stroke-linecap="round">
                    <line x1="215" y1="165" x2="275" y2="165"/>
                    <line x1="200" y1="182" x2="270" y2="182"/>
                    <line x1="225" y1="199" x2="278" y2="199"/>
                </g>

                <!-- Car (same shape as the logo) -->
                <g transform="translate(274 121) scale(2.6)">
                    <path d="M6 28 L10 17 Q12 12 18 12 L40 12 Q45 12 49 17 L54 22 Q60 23 60 28 L60 30 L6 30 Z" fill="#2b7bd6"/>
                    <path d="M16 17 Q17 15 20 15 L29 15 L29 22 L13 22 Z M32 15 L39 15 Q43 15 46 19 L48 22 L32 22 Z" fill="#dbeeff"/>
                    <circle cx="18" cy="30" r="6" fill="#0d3b66" stroke="#ffffff" stroke-width="1"/>
                    <circle cx="18" cy="30" r="2.5" fill="#ffffff"/>
                    <circle cx="48" cy="30" r="6" fill="#0d3b66" stroke="#ffffff" stroke-width="1"/>
                    <circle cx="48" cy="30" r="2.5" fill="#ffffff"/>
                </g>
            </svg>
        </section>

        <section class="panel panel-form">
            <div class="auth-card">
                <h2>Register</h2>
                <p class="subtitle">It only takes a minute.</p>

                <form id="register-form" novalidate>
                    <div class="account-type" role="radiogroup" aria-label="Account type">
                        <input type="radio" id="type-buyer" name="accountType" value="buyer" checked>
                        <label for="type-buyer">I'm a buyer</label>
                        <input type="radio" id="type-dealer" name="accountType" value="dealer">
                        <label for="type-dealer">I'm a dealer</label>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="full-name">Full name</label>
                            <input type="text" id="full-name" name="fullName" autocomplete="name" required>
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone number</label>
                            <input type="tel" id="phone" name="phoneNumber" autocomplete="tel" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" name="address" autocomplete="street-address" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="password-wrap">
                                <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
                                <button type="button" class="toggle-password" data-target="password">Show</button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="confirm-password">Confirm password</label>
                            <div class="password-wrap">
                                <input type="password" id="confirm-password" name="confirmPassword" autocomplete="new-password" required>
                                <button type="button" class="toggle-password" data-target="confirm-password">Show</button>
                            </div>
                        </div>
                    </div>

                    <p class="form-message" id="form-message" aria-live="polite"></p>

                    <button type="submit" class="btn btn-primary">Create account</button>
                </form>

                <p class="form-switch">Already have an account? <a href="../Login/login.html">Login</a></p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Carswich</p>
    </footer>

    <script src="register.js"></script>
</body>
</html>
