<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account | Carswich</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../Shared/app.css">
    <link rel="stylesheet" href="account.css">
</head>
<body>
    <header class="navbar">
        <!-- Left: logo icon, then profile pic and name after a divider -->
        <a href="../Home/home.html" class="logo" aria-label="Carswich dashboard">
            <svg class="logo-icon" viewBox="0 0 64 40" aria-hidden="true">
                <path d="M6 28 L10 17 Q12 12 18 12 L40 12 Q45 12 49 17 L54 22 Q60 23 60 28 L60 30 L6 30 Z" fill="#2b7bd6"/>
                <path d="M16 17 Q17 15 20 15 L29 15 L29 22 L13 22 Z M32 15 L39 15 Q43 15 46 19 L48 22 L32 22 Z" fill="#dbeeff"/>
                <circle cx="18" cy="30" r="6" fill="#0d3b66"/>
                <circle cx="18" cy="30" r="2.5" fill="#ffffff"/>
                <circle cx="48" cy="30" r="6" fill="#0d3b66"/>
                <circle cx="48" cy="30" r="2.5" fill="#ffffff"/>
                <path d="M2 36 Q32 42 62 36" stroke="#7cc4fa" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            </svg>
        </a>

        <div class="nav-user">
            <span class="avatar" data-user="initials" aria-hidden="true"></span>
            <span class="nav-user-name" data-user="fullName"></span>
        </div>

        <!-- Right: page links. The current page is marked with aria-current="page" -->
        <nav class="nav-links" aria-label="Main menu">
            <a href="../Home/home.html" class="nav-link">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
                Dashboard
            </a>
            <a href="../Browse/browse.html" class="nav-link">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20 L16 16"/></svg>
                Browse cars
            </a>
            <a href="../Account/account.html" class="nav-link" aria-current="page">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21 Q4 14 12 14 Q20 14 20 21"/></svg>
                Account
            </a>
        </nav>

        <!-- Far right: log out -->
        <a href="../index.html" class="btn btn-secondary btn-small nav-logout">Log out</a>
    </header>

    <main class="layout account-layout">
        <!-- Left: profile picture, then tabs. Each tab link's hash matches a section's data-tab -->
        <aside class="card-panel account-menu">
            <div class="menu-profile">
                <span class="avatar avatar-large" data-user="initials" aria-hidden="true"></span>
                <div class="menu-profile-text">
                    <p class="menu-profile-name" data-user="fullName"></p>
                    <p class="badge" data-user="userType"></p>
                </div>
            </div>

            <nav class="tabs" aria-label="Account sections">
                <a href="#details" class="tab-link">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21 Q4 14 12 14 Q20 14 20 21"/></svg>
                    Account details
                </a>
                <a href="#purchases" class="tab-link">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4 H19 V20 L16 18 L13 20 L10 18 L7 20 L5 18 Z"/><path d="M9 9 H15 M9 13 H15"/></svg>
                    Purchase history
                </a>
                <a href="#wallet" class="tab-link">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10 H21"/><circle cx="16.5" cy="14.5" r="1.2"/></svg>
                    Wallet
                </a>
            </nav>
        </aside>

        <!-- Right: the selected tab -->
        <div class="tab-panels">
            <!-- Account details -->
            <section class="card-panel" data-tab="details">
                <div class="panel-header">
                    <h1>Account details</h1>
                </div>

                <form class="account-form" id="account-form" novalidate>
                    <div class="form-group">
                        <label for="acc-name">Full name</label>
                        <input type="text" id="acc-name" name="fullName" autocomplete="name">
                    </div>
                    <div class="form-group">
                        <label for="acc-email">Email</label>
                        <input type="email" id="acc-email" name="email" autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="acc-phone">Phone number</label>
                        <input type="tel" id="acc-phone" name="phoneNumber" autocomplete="tel">
                    </div>
                    <div class="form-group">
                        <label for="acc-address">Address</label>
                        <input type="text" id="acc-address" name="address" autocomplete="street-address">
                    </div>

                    <p class="form-message" id="account-message" aria-live="polite"></p>
                    <button type="submit" class="btn btn-primary">Save changes</button>
                </form>
            </section>

            <!-- Purchase history -->
            <section class="card-panel" data-tab="purchases" hidden>
                <div class="panel-header">
                    <h1>Purchase history</h1>
                    <p class="muted" data-stat="spent"></p>
                </div>

                <div class="table-wrap">
                    <table class="purchases-table">
                        <thead>
                            <tr>
                                <th>Car</th>
                                <th>Dealer</th>
                                <th>Mileage</th>
                                <th>Date</th>
                                <th class="num">Price</th>
                            </tr>
                        </thead>
                        <tbody id="purchase-rows"></tbody>
                    </table>
                </div>
                <p class="empty" id="no-purchases" hidden>You haven't bought any cars yet.</p>
            </section>

            <!-- Wallet -->
            <section class="card-panel wallet" data-tab="wallet" hidden>
                <div class="panel-header">
                    <h1>Wallet</h1>
                </div>

                <div class="wallet-balance">
                    <p class="stat-label">Current balance</p>
                    <p class="wallet-amount" data-stat="balance"></p>
                </div>

                <form class="wallet-form" id="deposit-form" novalidate>
                    <div class="form-group">
                        <label for="deposit-amount">Add funds</label>
                        <!-- − and + replace the browser's own arrows, $1,000 per click -->
                        <div class="stepper">
                            <button type="button" class="stepper-btn" data-step="-1000" aria-label="Decrease by $1,000">−</button>
                            <input type="number" id="deposit-amount" min="0" step="1000" placeholder="Amount in $">
                            <button type="button" class="stepper-btn" data-step="1000" aria-label="Increase by $1,000">+</button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Deposit</button>
                </form>
                <p class="form-message" id="deposit-message" aria-live="polite"></p>
            </section>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Carswich</p>
    </footer>

    <script src="../Shared/app.js"></script>
    <script src="account.js"></script>
</body>
</html>
